name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: python3 .github/scripts/ac_audit.py
      - run: ./mvnw -B -ntp verify

  docs-site:
    name: Docs site (D-73)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - run: pip install -r docs/site/requirements.txt
      # A broken link, an orphan page or a missing file fails the build; docs.yml deploys it from main (D-73)
      - run: mkdocs build --strict -f docs/site/mkdocs.yml

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: DRY_RUN_USER
          server-password: DRY_RUN_PASSWORD
      - name: Build and sign release bundle (dry run)
        env:
          DRY_RUN_USER: dry-run
          DRY_RUN_PASSWORD: dry-run
        run: |
          gnupghome="$(mktemp -d)"
          export GNUPGHOME="${gnupghome}"
          gpg --batch --passphrase '' --quick-gen-key "Topolith CI <ci@example.com>" rsa3072 sign 1d
          export MAVEN_GPG_KEY="$(gpg --armor --export-secret-keys)"
          export MAVEN_GPG_PASSPHRASE=""
          version="$(sed -n 's:.*<revision>\(.*\)-SNAPSHOT</revision>.*:\1:p' pom.xml)"
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          ./mvnw -B -ntp -Prelease -DskipTests -Drevision="${version}" -DskipUpload=true deploy
      - name: Verify release bundle
        run: python3 .github/scripts/check_release_bundle.py target/central-staging "${RELEASE_VERSION}"

