name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign the release bundle without uploading to Central'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release to Maven Central
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
      - name: Guard non-dry run requires a v* tag
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Non-dry release runs must run from a refs/tags/v* tag (got ${GITHUB_REF})" >&2
          exit 1
      - name: Validate tag version, main ancestry and changelog entry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Tag version '${version}' does not match semantic version pattern" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not an ancestor of origin/main" >&2
            exit 1
          fi
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing section ## [${version}]" >&2
            exit 1
          fi
      - name: Build, sign and publish release bundle
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            version="$(sed -n 's:.*<revision>\(.*\)-SNAPSHOT</revision>.*:\1:p' pom.xml)"
          else
            echo "Non-dry release requires a refs/tags/v* ref" >&2
            exit 1
          fi
          extra_args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            extra_args+=("-DskipPublishing=true")
          fi
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          ./mvnw -B -ntp -Prelease -Drevision="${version}" "${extra_args[@]}" deploy
      - name: Verify release bundle
        run: python3 .github/scripts/check_release_bundle.py target/central-staging "${RELEASE_VERSION}"
