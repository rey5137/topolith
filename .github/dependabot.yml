version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-plugins:
        patterns: ['org.apache.maven.plugins:*', 'org.codehaus.mojo:*', 'org.sonatype.central:*']
      test:
        patterns: ['org.junit*', 'org.assertj:*', 'org.testcontainers:*', 'com.tngtech.archunit:*']
    ignore:
      # Compiled against the baseline (D-10); newer lines run in CI
      - dependency-name: 'org.springframework*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
